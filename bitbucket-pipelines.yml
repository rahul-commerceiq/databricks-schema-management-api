# DTP-496: Optimized Pipeline Configuration for PR Diff Validation
# This pipeline uses PR diff instead of full repository clone for validation

image: python:3.9

definitions:
  caches:
    pip: ~/.cache/pip

  steps:
    - step: &validate-schema-changes
        name: Validate Schema Changes (PR Diff)
        caches:
          - pip
        script:
          # Install dependencies
          - pip install -r requirements.txt
          
          # Set environment variables
          - export BITBUCKET_ACCESS_TOKEN=$BITBUCKET_ACCESS_TOKEN
          - export WORKSPACE=$BITBUCKET_WORKSPACE
          - export REPO_SLUG=$BITBUCKET_REPO_SLUG
          
          # Run PR diff validation
          - python validate_pr_diff.py --pr-id $BITBUCKET_PR_ID --workspace $WORKSPACE --repo-slug $REPO_SLUG --access-token $BITBUCKET_ACCESS_TOKEN --output validation_report.json
          
          # Generate human-readable report
          - python generate_validation_report.py --input validation_report.json --output validation_summary.txt
          
          # Display validation summary
          - cat validation_summary.txt
        artifacts:
          - validation_report.json
          - validation_summary.txt
        after-script:
          # Cleanup temporary files
          - rm -f *.tmp

    - step: &validate-schema-changes-legacy
        name: Validate Schema Changes (Legacy - Full Clone)
        caches:
          - pip
        script:
          # Fallback to full repository clone if PR diff validation fails
          - git clone https://$BITBUCKET_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG.git .
          - pip install -r requirements.txt
          - python validate_all_yaml_files.py --workspace $BITBUCKET_WORKSPACE --repo-slug $BITBUCKET_REPO_SLUG
        artifacts:
          - validation_report.json

pipelines:
  pull-requests:
    '**':
      - step: *validate-schema-changes
      - step:
          name: Fallback Validation (if needed)
          condition:
            changes:
              includePaths:
                - "**/*.yaml"
                - "**/*.yml"
          script:
            - echo "Running fallback validation for YAML changes"
            - python validate_pr_diff.py --pr-id $BITBUCKET_PR_ID --workspace $BITBUCKET_WORKSPACE --repo-slug $BITBUCKET_REPO_SLUG --access-token $BITBUCKET_ACCESS_TOKEN --output fallback_validation_report.json
            - python generate_validation_report.py --input fallback_validation_report.json --output fallback_summary.txt
            - cat fallback_summary.txt
          artifacts:
            - fallback_validation_report.json
            - fallback_summary.txt

  branches:
    main:
      - step:
          name: Full Repository Validation
          caches:
            - pip
          script:
            - git clone https://$BITBUCKET_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG.git .
            - pip install -r requirements.txt
            - python validate_all_yaml_files.py --workspace $BITBUCKET_WORKSPACE --repo-slug $BITBUCKET_REPO_SLUG
          artifacts:
            - validation_report.json

  custom:
    performance-test:
      - step:
          name: Performance Testing
          caches:
            - pip
          script:
            - pip install -r requirements.txt
            - python performance_test.py --workspace $BITBUCKET_WORKSPACE --repo-slug $BITBUCKET_REPO_SLUG --access-token $BITBUCKET_ACCESS_TOKEN
          artifacts:
            - performance_report.json