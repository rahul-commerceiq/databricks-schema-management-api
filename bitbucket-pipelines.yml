clone:
  depth: full    # SonarCloud scanner needs the full history to assign issues properly
# Bitbucket Pipeline for sp-api-client
definitions:
  caches:
    sonar: ~/.sonar/cache
  services:
    docker:
      memory: 2048

  codeQualityTest: &codeQualityTest
    name: Code Quality Check
    runs-on:
      - "self.hosted"
      - "infra.k8s"
      - "linux"
    image:
      name: 208876916689.dkr.ecr.us-west-2.amazonaws.com/java:openjdk17-builder_20231130
      aws:
        oidc-role: arn:aws:iam::208876916689:role/BitbucketPipelinesECRAccessRole
    oidc: true
    caches:
      - maven
      - sonar
    script:
      - export AWS_ROLE_ARN=$AWS_ROLE_ARN
      - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
      - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
      - mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dcheckstyle.skip -Dsonar.qualitygate.wait=true

  buildRepo: &buildRepo
    name: Build the Jar for the repo
    runs-on:
      - 'self.hosted'
      - 'infra'
      - 'linux'
    image:
      name: 208876916689.dkr.ecr.us-west-2.amazonaws.com/java:openjdk17-builder_20231130
      aws:
        oidc-role: arn:aws:iam::208876916689:role/BitbucketPipelinesECRAccessRole
    oidc: true
    caches:
      - maven
    script:
      - echo $BITBUCKET_CLONE_DIR
      - bash runner.sh
    artifacts:
      - target/**
  buildImage: &buildImage
    name: Build and Push Docker Image
    runs-on:
      - 'self.hosted'
      - 'infra'
      - 'linux'
    image:
      name: 208876916689.dkr.ecr.us-west-2.amazonaws.com/infra/pipelines-awscli:latest
      aws:
        oidc-role: arn:aws:iam::208876916689:role/BitbucketPipelinesECRAccessRole
    oidc: true
    caches:
      - docker
    size: 2x
    services:
      - docker
    script:
      - unset AWS_ACCESS_KEY_ID
      - unset AWS_SECRET_ACCESS_KEY
      - export AWS_REGION=us-west-2
      - export AWS_ROLE_ARN=arn:aws:iam::208876916689:role/BitbucketPipelinesAccessRole
      - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
      - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
      - export IMAGE_URI=$IMAGE_REPO:$BITBUCKET_COMMIT
      # Login to AWS ECR
      - echo $IMAGE_URI
      - aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 208876916689.dkr.ecr.us-west-2.amazonaws.com
      # Build image
      - docker build -f Dockerfile -t $IMAGE_URI .
      # Push image to private registry
      - docker push $IMAGE_URI
  buildDeployFacets: &buildDeployFacets
    name: Build and Deploy Facets
    image:
      name: 208876916689.dkr.ecr.us-east-1.amazonaws.com/infra/atlassian-default:facets
      aws:
        oidc-role: arn:aws:iam::208876916689:role/BitbucketPipelinesECRAccessRole
    oidc: true
    size: 2x
    services:
      - docker
  deployApp: &deployApp
    name: Deploy app into k8s
    image:
      name: 208876916689.dkr.ecr.us-west-2.amazonaws.com/astra
      aws:
        oidc-role: arn:aws:iam::208876916689:role/BitbucketPipelinesECRAccessRole
    oidc: true
    services:
      - docker
    caches:
      - docker
    deployment: test
    script:
      - echo "astra deployment"
  deployInfra: &deployInfra
    name: Deploy Infra on AWS
    runs-on:
      - 'self.hosted'
      - 'terraform'
      - 'linux'
    image:
      name: 208876916689.dkr.ecr.us-west-2.amazonaws.com/terragrunt
      aws:
        oidc-role: arn:aws:iam::208876916689:role/BitbucketPipelinesECRAccessRole
    oidc: true
    services:
      - docker
    caches:
      - docker
    size: 2x
    script:
      - unset AWS_ACCESS_KEY_ID
      - unset AWS_SECRET_ACCESS_KEY
      - export AWS_REGION=us-west-2
      - export AWS_ROLE_ARN=arn:aws:iam::208876916689:role/BitbucketPipelinesAccessRole
      - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
      - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
      - cd infrastructure
      - cp configs/beta-dbx/commons.hcl .
      - terragrunt run-all plan --terragrunt-source-update

  StartInfraCreation: &StartInfraCreation
    name: Start Infra Creation
    image: atlassian/pipelines-awscli
    script:
      - echo "running terragrunt apply"

pipelines:
  default: # Run build for all branches
    - step: *codeQualityTest
    - step: *buildRepo
  pull-requests:
    '**': # Run for all pull requests
      - step: 
          <<: *codeQualityTest
          name: Code Quality Check for PR
      - step:
          <<: *buildRepo
          name: Build and PR Validation
          script:
            - echo $BITBUCKET_CLONE_DIR
            - bash runner.sh
            # Add PR validation call if this is a pull request
            - |
              if [ -n "$BITBUCKET_PR_ID" ]; then
                echo "Running PR-specific validation for PR ID: $BITBUCKET_PR_ID"
                # Wait for application to start and then call the PR validation endpoint
                nohup mvn spring-boot:run -Dspring-boot.run.arguments="--server.port=8080" &
                sleep 30
                curl -X GET "http://localhost:8080/schemaManagement/v1/validate-pr?pullRequestId=$BITBUCKET_PR_ID&userName=${BITBUCKET_STEP_TRIGGERER_UUID:-system}" -H "accept: application/json"
              else
                echo "Not a pull request - skipping PR validation"
              fi
  release-dbx:
    - step: *codeQualityTest
    - step: *buildRepo
    - step: *buildImage
#      - step:
#          <<: *deployInfra
#          script:
#            - unset AWS_ACCESS_KEY_ID
#            - unset AWS_SECRET_ACCESS_KEY
#            - export AWS_REGION=us-west-2
#            - export AWS_ROLE_ARN=arn:aws:iam::208876916689:role/BitbucketPipelinesAccessRole
#            - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
#            - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
#            - cd infrastructure
#            - cp configs/prod/commons.hcl .
#            - terragrunt run-all plan --terragrunt-source-update
  branches:
    develop-dbx:
      - step: *codeQualityTest
      - step: *buildRepo
      - step:
          <<: *buildDeployFacets
          script:
            - export AWS_ROLE_ARN=arn:aws:iam::208876916689:role/BitbucketPipelinesAccessRole
            - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
            - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
            - export BB_COMMIT=$(echo $BITBUCKET_COMMIT | cut -c1-8)
            - export IMAGE_URI=$IMAGE_REPO:$BITBUCKET_COMMIT
            - echo $IMAGE_URI
            - eval $(aws ecr get-login --region us-west-2 --no-include-email)
            - docker build -t "$IMAGE_URI" .
            - facetsctl login -u ops@commerceiq.ai -t $FACETS_TOKEN  -c https://commerceiq-cp.console.facets.cloud
            - facetsctl push -i $IMAGE_URI -a databricks-schema-management-api -e $BB_COMMIT --registration-type CLUSTER --registration-value $CP_BETA_FACETS_REGISTRATION_VALUE
    release-dbx:
      - step: *codeQualityTest
      - step: *buildRepo
      - step:
          <<: *buildDeployFacets
          script:
            - export AWS_ROLE_ARN=arn:aws:iam::208876916689:role/BitbucketPipelinesAccessRole
            - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
            - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
            - export BB_COMMIT=$(echo $BITBUCKET_COMMIT | cut -c1-8)
            - export IMAGE_URI=$IMAGE_REPO:$BITBUCKET_COMMIT
            - echo $IMAGE_URI
            - eval $(aws ecr get-login --region us-west-2 --no-include-email)
            - docker build -t "$IMAGE_URI" .
            - facetsctl login -u ops@commerceiq.ai -t $FACETS_TOKEN  -c https://commerceiq-cp.console.facets.cloud
            - facetsctl push -i $IMAGE_URI -a databricks-schema-management-api -e $BB_COMMIT --registration-type CLUSTER --registration-value $CP_QA_FACETS_REGISTRATION_VALUE
    master-dbx:
      - step: *codeQualityTest
      - step: *buildRepo
      - step: *StartInfraCreation
#      - step:
#          <<: *deployInfra
#          trigger: manual
#          deployment: prod
#          script:
#            - export AWS_ROLE_ARN=arn:aws:iam::208876916689:role/BitbucketPipelinesAccessRole
#            - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
#            - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
#            - cd infrastructure
#            - cp configs/prod/commons.hcl .
#            - terragrunt run-all apply --terragrunt-non-interactive --terragrunt-source-update
      - step:
          step: *codeQualityTest
          <<: *buildDeployFacets
          script:
            - export AWS_ROLE_ARN=arn:aws:iam::208876916689:role/BitbucketPipelinesAccessRole
            - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
            - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
            - export BB_COMMIT=$(echo $BITBUCKET_COMMIT | cut -c1-8)
            - export IMAGE_URI=$IMAGE_REPO:$BITBUCKET_COMMIT
            - echo $IMAGE_URI
            - eval $(aws ecr get-login --region us-west-2 --no-include-email)
            - docker build -t "$IMAGE_URI" .
            - facetsctl login -u ops@commerceiq.ai -t $FACETS_TOKEN  -c https://commerceiq-cp.console.facets.cloud
            - facetsctl push -i $IMAGE_URI -a databricks-schema-management-api -e $BB_COMMIT --registration-type CLUSTER --registration-value $CP_PROD_FACETS_REGISTRATION_VALUE